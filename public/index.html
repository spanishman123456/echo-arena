<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230A1222'/%3E%3Ccircle cx='20' cy='20' r='11' fill='none' stroke='%2338E1D2' stroke-width='2.5'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%2338E1D2'/%3E%3C/svg%3E">
<title>Echo Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a night-time robot arena. Sonar rings radiate from the stage; one broadcast bar on top, the stage below, the teacher's dock at the bottom. */
:root{
  color-scheme: dark;
  --ink:#0A1222;        /* arena floor */
  --ink-2:#0F1A30;      /* panels */
  --ink-3:#16233F;      /* raised */
  --line:#24345A;       /* hairlines */
  --fg:#ECF2FF;         /* text */
  --muted:#93A3C6;      /* secondary text */
  --sonar:#38E1D2;      /* sonar ping, the one accent */
  --signal:#FFB547;     /* judge / warning */
  --ok:#4BE38A;
  --bad:#FF5C7A;
  --gold:#F6C445; --silver:#CDD6E3; --bronze:#D98B4E;
  --f-display:"Bungee","Impact","Arial Black",sans-serif;
  --f-body:"Lexend","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(1200px 700px at 50% 115%, rgba(56,225,210,.10), transparent 60%),
  repeating-radial-gradient(circle at 50% 115%, transparent 0 78px, rgba(56,225,210,.045) 79px 80px),
  linear-gradient(rgba(36,52,90,.25) 1px, transparent 1px) 0 0/48px 48px,
  linear-gradient(90deg, rgba(36,52,90,.25) 1px, transparent 1px) 0 0/48px 48px}
#app{position:relative;z-index:1;min-height:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sonar);outline-offset:2px}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--ink-3);padding:10px 16px;border-radius:12px;font-weight:600;transition:transform .12s, background .2s, border-color .2s}
.btn:hover{border-color:var(--sonar)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--sonar);color:#04201D;border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--signal);color:#2B1700;border-color:transparent}
.btn.good{background:var(--ok);color:#052814;border-color:transparent}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;border-radius:9px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:17px;border-radius:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;background:var(--ink-2);white-space:nowrap}
.chip.on{border-color:var(--sonar);color:var(--sonar)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 rgba(75,227,138,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(75,227,138,0)}100%{box-shadow:0 0 0 0 rgba(75,227,138,0)}}
.panel{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r)}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;box-sizing:border-box;background:var(--ink);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:70px}
label.fld{display:grid;gap:6px;font-size:13px;color:var(--muted)}

/* team emblem */
.emb{--tc:var(--sonar);width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 22%, var(--ink-2));border:2px solid var(--tc);color:var(--tc);font-family:var(--f-display);font-size:20px;position:relative}
.emb svg{width:70%;height:70%}
.emb.big{width:72px;height:72px;border-radius:18px;font-size:34px}

/* top bar */
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;border-bottom:1px solid var(--line);background:rgba(10,18,34,.8);backdrop-filter:blur(8px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:34px;height:34px}
.logo b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.bar .grow{flex:1}
.timer{font-family:var(--f-display);font-size:26px;letter-spacing:.04em;padding:4px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2)}
.timer.low{color:var(--signal);border-color:var(--signal)}
.timer.out{color:var(--bad);border-color:var(--bad);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}

/* phase rail */
.rail{display:flex;gap:6px;flex-wrap:wrap}
.rail .ph{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:transparent}
.rail .ph.done{color:var(--fg);border-color:#33507f}
.rail .ph.cur{background:var(--sonar);color:#04201D;border-color:transparent;font-weight:700}

/* landing */
.land{max-width:1100px;margin:0 auto;padding-block:40px 60px;display:grid;gap:28px}
.hero{display:grid;gap:14px;justify-items:start}
.hero h1{font-family:var(--f-display);font-size:clamp(44px,8vw,96px);line-height:.95;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--sonar)}
.hero p{max-width:60ch;color:var(--muted);font-size:17px;margin:0}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tcard{--tc:var(--sonar);text-align:left;display:grid;gap:12px;padding:18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 14%,var(--ink-2)),var(--ink-2) 60%);transition:transform .15s,border-color .2s}
.tcard:hover{transform:translateY(-3px);border-color:var(--tc)}
.tcard h3{font-family:var(--f-display);font-size:24px;color:var(--tc)}

/* screen (projector) */
.screen{font-size:clamp(14px,1.05vw,22px)}
.stage{padding-block:2.2em 7em;display:grid;gap:1.6em}
.stage h2.big{font-family:var(--f-display);font-size:3.2em;line-height:1}
.stage .lead{font-size:1.25em;color:var(--muted);max-width:60ch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2em}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1em}
@media (max-width:900px){.grid2,.grid4{grid-template-columns:1fr}}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:2em;align-items:start}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.lobby h1{font-family:var(--f-display);font-size:5.4em;line-height:.92}
.lobby h1 em{font-style:normal;color:var(--sonar);display:block}
.agenda{display:grid;gap:.5em;margin:0;padding:0;list-style:none}
.agenda li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:.8em;align-items:center;padding:.55em .8em;border-radius:12px;background:var(--ink-2);border:1px solid var(--line)}
.agenda li .n{font-family:var(--f-display);color:var(--sonar)}
.agenda li.cur{border-color:var(--sonar)}
.joinbox{display:grid;gap:1em;justify-items:center;padding:1.4em;text-align:center}
.qr{background:#fff;padding:10px;border-radius:14px;line-height:0}
.qr svg{width:min(240px,60vw);height:auto}
.joined{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6em;width:100%}
.joined .j{display:flex;align-items:center;gap:.6em;padding:.5em .7em;border-radius:12px;border:1px solid var(--line);text-align:left}
.joined .j.in{border-color:var(--ok)}

/* sonar disc */
.sonar{position:relative;width:min(380px,70vw);aspect-ratio:1;max-width:100%}
.sonar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--sonar);opacity:0;animation:ping 3.6s cubic-bezier(.2,.6,.3,1) infinite}
.sonar i:nth-child(2){animation-delay:1.2s}.sonar i:nth-child(3){animation-delay:2.4s}
@keyframes ping{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.sonar .core{position:absolute;inset:38%;border-radius:50%;background:radial-gradient(circle,var(--sonar),transparent 70%);opacity:.7}

/* mission cards */
.mcard{--tc:var(--sonar);padding:1.1em 1.2em;border-radius:18px;border:1px solid var(--line);background:linear-gradient(170deg,color-mix(in srgb,var(--tc) 12%,var(--ink-2)),var(--ink-2) 55%);display:grid;gap:.7em;align-content:start}
.mcard .hd{display:flex;align-items:center;gap:.7em}
.mcard h3{font-family:var(--f-display);font-size:1.35em;color:var(--tc)}
.tierline{display:flex;gap:.5em;flex-wrap:wrap}
.tier{font-size:.78em;font-weight:700;padding:.25em .7em;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.tier.silver{background:color-mix(in srgb,var(--silver) 20%,transparent);color:var(--silver);border:1px solid var(--silver)}
.tier.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);border:1px solid var(--gold)}
.roles{display:flex;flex-wrap:wrap;gap:.4em}
.role{font-size:.78em;padding:.2em .6em;border-radius:8px;background:var(--ink);border:1px solid var(--line)}
.role b{color:var(--fg)}
.poll{display:grid;gap:.5em}
.poll .opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em;align-items:center;padding:.5em .8em;border-radius:12px;border:1px solid var(--line);position:relative;overflow:hidden}
.poll .opt .fill{position:absolute;inset:0 auto 0 0;background:rgba(56,225,210,.12);transition:width .6s}
.poll .opt>*{position:relative}
.poll .opt.right{border-color:var(--ok)}
.poll .votes{display:flex;gap:.3em}

/* race lanes */
.lanes{display:grid;gap:.8em}
.lane{--tc:var(--sonar);display:grid;grid-template-columns:minmax(11em,1.1fr) minmax(0,3fr) minmax(8em,auto);gap:1em;align-items:center;padding:.8em 1em;border-radius:18px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,var(--ink-2)),var(--ink-2) 40%)}
@media (max-width:900px){.lane{grid-template-columns:1fr}}
.lane .who{display:flex;align-items:center;gap:.7em;min-width:0}
.lane .who b{font-family:var(--f-display);font-size:1.2em;color:var(--tc);display:block}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.4em;align-items:center}
.stg{display:grid;gap:.3em}
.stg .lbl{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.25em}
.steps span{height:.8em;border-radius:4px;background:var(--ink);border:1px solid var(--line);position:relative}
.steps span.on{background:var(--tc);border-color:var(--tc)}
.steps span.pend{background:var(--signal);border-color:var(--signal);animation:blink 1s steps(2) infinite}
.stepnames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.25em;font-size:.62em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lane .res{display:flex;align-items:center;gap:.6em;justify-content:flex-end}
.lane .res .t{font-family:var(--f-display);font-size:1.3em}
.feed{display:grid;gap:.4em;max-height:22em;overflow:auto}
.feed .ev{display:flex;gap:.6em;align-items:center;font-size:.92em;padding:.45em .7em;border-radius:10px;background:var(--ink-2);border:1px solid var(--line)}
.feed .ev time{color:var(--muted);font-family:var(--f-mono);font-size:.85em}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(16em,22em);gap:1.2em;align-items:start}
@media (max-width:1000px){.labgrid{grid-template-columns:1fr}}
.bigclock{font-family:var(--f-display);font-size:4.2em;line-height:1;letter-spacing:.03em}
.judgeq{display:grid;gap:.6em}
.jcard{--tc:var(--signal);padding:.8em;border-radius:14px;border:2px solid var(--signal);background:color-mix(in srgb,var(--signal) 10%,var(--ink-2));display:grid;gap:.5em}
.jcard .log{font-size:.88em;color:var(--fg);background:var(--ink);border-radius:10px;padding:.5em .7em;max-height:6em;overflow:auto}

/* code blocks (mBlock look) */
.prog{font:600 14px/1.2 var(--f-body);color:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;background:
  radial-gradient(circle,#2a3a5e 1px,transparent 1.5px) 0 0/18px 18px, #101a2f;border-radius:14px;border:1px solid var(--line);overflow-x:auto;min-width:0}
.prog .ln{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.blk{--c:#4C97FF;display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:7px;background:var(--c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.blk.hat{border-radius:22px 22px 7px 7px;padding-top:11px}
.cb{--c:#FFAB19;display:flex;flex-direction:column;align-items:flex-start}
.cb>.h,.cb>.ln>.h{background:var(--c);padding:7px 11px;border-radius:7px 7px 7px 0;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.cb>.h.mid{border-radius:0 7px 7px 0}
.cb>.in{border-left:18px solid var(--c);padding:3px 0 3px 4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:26px}
.cb>.f{background:var(--c);width:70px;height:14px;border-radius:0 0 7px 7px}
.rep{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--rc,#0B9A72);border:1px solid rgba(0,0,0,.25)}
.bool{display:inline-flex;align-items:center;gap:5px;padding:4px 18px;background:var(--bc,#0FAE80);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.val{background:#fff;color:#3d3d3d;border-radius:999px;padding:1px 9px;font-weight:700;text-shadow:none}
.dd{background:rgba(0,0,0,.2);border-radius:999px;padding:1px 9px}
.dd::after{content:" ▾";font-size:.8em}
.note{font:italic 500 12px var(--f-body);color:var(--sonar);text-shadow:none;white-space:nowrap}
.slot{border:2px dashed #fff;background:rgba(10,18,34,.55);color:#fff;border-radius:9px;padding:3px 10px;min-width:46px;font-weight:700;text-shadow:none;animation:wob 2.4s ease-in-out infinite;white-space:nowrap}
.slot.filled{border-style:solid;background:#fff;color:#1b2440;animation:none}
.slot.hinted{border-color:var(--signal);box-shadow:0 0 0 3px rgba(255,181,71,.45)}
.slot.ok{border-color:var(--ok);background:#E9FFF2;color:#0b3b20}
.slot[disabled]{cursor:default}
@keyframes wob{50%{transform:translateY(-1px)}}
.pop{position:fixed;z-index:60;background:var(--ink-3);border:1px solid var(--sonar);border-radius:14px;padding:8px;display:grid;gap:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);max-width:min(92vw,360px)}
.pop button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--ink-2);font-weight:600}
.pop button:hover{border-color:var(--sonar)}
.pop .q{font-size:12px;color:var(--muted);padding:2px 4px}

/* team view */
.tv{max-width:1180px;margin:0 auto;padding-block:18px 60px;display:grid;gap:18px}
.tvhead{--tc:var(--sonar);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tvhead h1{font-family:var(--f-display);font-size:clamp(26px,4vw,40px);color:var(--tc)}
.tvhead .grow{flex:1}
.pts{font-family:var(--f-display);font-size:22px;padding:4px 12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line)}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stepper .s{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);display:grid;gap:2px}
.stepper .s b{font-size:13px}
.stepper .s small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.stepper .s.cur{border-color:var(--sonar);box-shadow:inset 0 0 0 1px var(--sonar)}
.stepper .s.done{border-color:var(--ok)}
.stepper .s.done small{color:var(--ok)}
.labcols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.labcols{grid-template-columns:1fr}}
.box{padding:16px;display:grid;gap:12px;align-content:start}
.box h3{font-size:16px}
.checkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--ink)}
.msg.good{border-color:var(--ok);color:var(--ok)}
.msg.warn{border-color:var(--signal);color:var(--signal)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.ticks{display:grid;gap:8px}
.tick{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;text-align:left}
.tick .bx{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px}
.tick.on{border-color:var(--ok)}
.tick.on .bx{background:var(--ok);border-color:var(--ok);color:#052814}
.minirace{display:grid;gap:6px}
.minirace .r{--tc:var(--sonar);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px}
.minirace .bar2{height:8px;border-radius:6px;background:var(--ink);overflow:hidden;border:1px solid var(--line)}
.minirace .bar2 i{display:block;height:100%;background:var(--tc);transition:width .6s}
.wait{display:grid;justify-items:center;gap:16px;text-align:center;padding-block:40px}
.wait h2{font-family:var(--f-display);font-size:clamp(26px,4vw,44px)}

/* sim */
.sim{display:grid;gap:10px}
.sim canvas{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:14px;border:1px solid var(--line);background:#081020;display:block}
.simbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.simlog{font:500 12px/1.5 var(--f-mono);color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:3.2em}
.simlog b{color:var(--sonar)}

/* rubric */
.rub{display:grid;gap:12px}
.crit{display:grid;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--ink-2)}
.crit .ch{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:700px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lev{text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink);font-size:12.5px;line-height:1.35;display:grid;gap:4px}
.lev b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lev.on{border-color:var(--sonar);background:color-mix(in srgb,var(--sonar) 12%,var(--ink))}
.lev.on b{color:var(--sonar)}
.scorecard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);padding:16px;display:grid;gap:10px;justify-items:center;text-align:center}
@media (max-width:900px){.scorecard{order:-1;position:static}}
.scorecard .n{font-family:var(--f-display);font-size:56px;line-height:1}
.band{font-weight:700;padding:4px 12px;border-radius:999px;border:1px solid currentColor}
.ican{display:grid;gap:6px}
.ican .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:6px 10px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--sonar);color:#04201D}

/* quiz */
.qcard{display:grid;gap:1em}
.qtext{font-size:2em;font-weight:600;line-height:1.25;max-width:42ch}
.qopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em}
@media (max-width:700px){.qopts{grid-template-columns:1fr}}
.qo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.8em;align-items:center;text-align:left;padding:.9em 1em;border-radius:16px;border:1px solid var(--line);background:var(--ink-2);font-size:1.1em;font-weight:500}
.qo .k{font-family:var(--f-display);width:1.8em;height:1.8em;display:grid;place-items:center;border-radius:10px;background:var(--ink);border:1px solid var(--line)}
.qo.pick{border-color:var(--sonar)}
.qo.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--ink-2))}
.qo.wrong{border-color:var(--bad);opacity:.8}
.qo.dim{opacity:.45}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2em;align-items:end;max-width:1100px;margin:0 auto;width:100%}
.pod{--tc:var(--sonar);display:grid;justify-items:center;gap:.6em;text-align:center}
.pod .plinth{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.4em;color:var(--ink);padding:.3em 0}
.pod.p1 .plinth{height:4.4em;background:linear-gradient(var(--gold),#b78a1d)}
.pod.p2 .plinth{height:3.2em;background:linear-gradient(var(--silver),#8995a6)}
.pod.p3 .plinth{height:2.2em;background:linear-gradient(var(--bronze),#8e5226)}
.pod b{font-family:var(--f-display);font-size:1.4em;color:var(--tc)}
.pod.empty{opacity:.35}
table.sb{width:100%;border-collapse:collapse;font-size:.95em}
table.sb th,table.sb td{padding:.55em .7em;border-bottom:1px solid var(--line);text-align:left}
table.sb th{font-size:.72em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.sb td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* spotlight */
.spot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.4em;align-items:start}
@media (max-width:900px){.spot{grid-template-columns:1fr}}
.fbcard{--tc:var(--sonar);padding:.8em 1em;border-radius:14px;border:1px solid var(--line);border-left:5px solid var(--tc);background:var(--ink-2);display:grid;gap:.35em}
.stars{color:var(--gold);letter-spacing:.1em}
.prompts{display:grid;gap:.5em;margin:0;padding:0;list-style:none;counter-reset:p}
.prompts li{counter-increment:p;display:grid;grid-template-columns:2em minmax(0,1fr);gap:.6em;align-items:baseline;font-size:1.15em}
.prompts li::before{content:counter(p);font-family:var(--f-display);color:var(--sonar)}
.starpick{display:flex;gap:4px}
.starpick button{background:transparent;border:0;font-size:26px;line-height:1;color:var(--line);padding:2px}
.starpick button.on{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--ink);font-size:13px;font-weight:600}
.chips button.on{border-color:var(--sonar);color:var(--sonar);background:color-mix(in srgb,var(--sonar) 10%,var(--ink))}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,15,29,.96);border-top:1px solid var(--line);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:10px}
.dock .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-right:10px;border-right:1px solid var(--line)}
.dock .grp:last-child{border-right:0}
.dock .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.showdock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:31;opacity:.35}
.showdock:hover{opacity:1}

/* overlays */
.ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(4,8,18,.82);backdrop-filter:blur(6px);padding:20px}
.ov .card{max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px}
.cere{display:grid;justify-items:center;gap:14px;text-align:center;animation:rise .7s cubic-bezier(.2,1.4,.4,1)}
.cere h2{font-family:var(--f-display);font-size:clamp(34px,6vw,76px);line-height:1}
.cere .medal{width:min(260px,50vw);filter:drop-shadow(0 20px 40px rgba(0,0,0,.5));animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes rise{from{transform:scale(.6) translateY(40px);opacity:0}}
@keyframes swing{50%{transform:rotate(4deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.toasts{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:70;display:grid;gap:8px;max-width:min(380px,90vw)}
.toast{--tc:var(--sonar);padding:12px 14px;border-radius:14px;background:var(--ink-3);border:1px solid var(--tc);box-shadow:0 12px 30px rgba(0,0,0,.4);display:flex;gap:10px;align-items:center;animation:rise .4s ease-out;font-weight:500}

/* film */
.film{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000;width:100%;max-width:min(100%,calc((100vh - 240px) * 16 / 9));margin:0 auto}
.film canvas{display:block;width:100%;aspect-ratio:16/9;max-width:100%}
.film iframe{display:block;width:100%;aspect-ratio:16/9;max-width:100%;border:0}
.film .ctl{position:absolute;inset:auto 0 0 0;display:flex;gap:8px;align-items:center;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.film .prog2{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.film .prog2 i{display:block;height:100%;width:0;background:var(--sonar)}
.film .start{position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:12%;background:radial-gradient(circle at 50% 50%,rgba(56,225,210,.18),rgba(0,0,0,.6));}
.banner{padding:8px 14px;border-radius:12px;border:1px solid var(--signal);color:var(--signal);background:color-mix(in srgb,var(--signal) 8%,var(--ink));font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

/* ---------------- Store: live server sync (no sign-in), local fallback ---------------- */
const Store = (() => {
  const docs = {};
  let mode = "local", listeners = [], online = {}, v = 0, live = false, queue = [], flushing = false;
  const LS = "echoArena.local.v1";
  let bc = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const notify = () => listeners.forEach(fn => fn());
  const who = () => App.view === "team" ? App.teamId : App.view === "control" ? "control" : "screen";
  function loadLocal(){ const m = lsGet(LS, {}); Object.keys(docs).forEach(k => delete docs[k]); Object.assign(docs, m); }
  function saveLocal(){ lsSet(LS, docs); try { bc && bc.postMessage("sync"); } catch(e){} }
  function applyOp(o){ if (o.op === "set") docs[o.path] = clone(o.data); else if (o.op === "update") docs[o.path] = deepMerge(docs[o.path] || {}, o.data); else if (o.op === "del") delete docs[o.path]; }
  function applyServer(d){
    const onl = JSON.stringify(d.online || {}), changed = d.v !== v || onl !== JSON.stringify(online);
    online = d.online || {};
    if (d.v !== v){ v = d.v; Object.keys(docs).forEach(k => delete docs[k]); Object.assign(docs, d.docs || {}); queue.forEach(applyOp); if (App.view === "control") lsSet("echoArena.cache", docs); }
    if (changed) notify();
  }
  function setLive(x){ if (x !== live){ live = x; notify(); } }
  async function poll(){
    while (true){
      try { const r = await fetch(`/api/sync?since=${v}&who=${encodeURIComponent(who())}`, {cache:"no-store"}); if (!r.ok) throw new Error(r.status); applyServer(await r.json()); setLive(true); }
      catch(e){ setLive(false); await sleep(2000); }
    }
  }
  async function flush(){
    if (flushing || mode !== "server") return; flushing = true;
    while (queue.length){
      const batch = queue.slice(0, 50);
      try { const r = await fetch("/api/write", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ops:batch})}); if (!r.ok) throw new Error(r.status); queue.splice(0, batch.length); setLive(true); }
      catch(e){ setLive(false); await sleep(1500); }
    }
    flushing = false;
  }
  function write(op){
    applyOp(op);
    if (mode === "local"){ saveLocal(); notify(); return Promise.resolve(); }
    queue.push(op); notify(); return flush();
  }
  async function init(){
    loadLocal();
    try { bc = new BroadcastChannel("echo-arena"); bc.onmessage = () => { if (mode === "local"){ loadLocal(); notify(); } }; } catch(e){}
    if (!/^https?:$/.test(location.protocol)) return mode;
    try {
      const r = await fetch(`/api/sync?since=0&who=${encodeURIComponent(who())}`, {cache:"no-store"});
      if (!r.ok) throw new Error(r.status);
      const d = await r.json(); mode = "server"; Object.keys(docs).forEach(k => delete docs[k]); applyServer(d); live = true; poll();
    } catch(e){ mode = "local"; }
    return mode;
  }
  return { init,
    set:(path, data) => write({op:"set", path, data:clone(data)}),
    update:(path, data) => write({op:"update", path, data:clone(data)}),
    del:path => write({op:"del", path}),
    presence(){}, get:p => docs[p], all:() => docs, on:fn => listeners.push(fn),
    get mode(){ return mode; }, get live(){ return live; }, canWrite:true, get online(){ return online; } };
})();

function stageStatus(id, stage){
  const t = team(id), sd = (t.stages || {})[stage] || {};

function race(){
  const s = st(); const final = s && phaseIdx(s.phase) > phaseIdx("lab");
  const rows = TEAM_IDS.map(id => {
    const t = team(id), stg = stagesOf(id), done = stagesDone(id);
    const last = done ? Math.max(...stg.filter(x => t.verified && t.verified[x]).map(x => t.verified[x].ms || 0)) : Infinity;
    return {id, done, total: stg.length, finished: done === stg.length, ms: last};
  });
  rows.sort((a,b) => (b.finished - a.finished) || (b.done - a.done) || (a.ms - b.ms));
  let pos = 0;
  rows.forEach(r => { r.medal = null; if (r.finished || (final && r.done > 0)) { r.medal = ["gold","silver","bronze","finisher"][Math.min(pos,3)]; r.place = pos + 1; pos++; } });
  return rows;
}

  if (t.warm && t.warm.c === CH[c.challenge].warm.ans) b.warm = PTS.warm;
  stagesOf(id).forEach(x => { if (t.verified && t.verified[x]) b[x] = PTS[x]; });
  const r = race().find(r => r.id === id); if (r && r.medal) b.medal = PTS.medal[["gold","silver","bronze","finisher"].indexOf(r.medal)];
  const hints = Object.values(t.stages || {}).reduce((n, sd) => n + ((sd.hints || []).length), 0); if (hints) b.hints = hints * PTS.hint;
  const qz = s.quiz || {i:-1}; let qp = 0;
  QUIZ.forEach((q, i) => { const a = (t.quiz || {})[i]; const shown = i < qz.i || (i === qz.i && qz.reveal); if (a && shown && a.c === q.a) qp += PTS.quiz; });
  if (qp) b.quiz = qp;
  const fb = feedbacks().filter(f => f.from === id).length; if (fb) b.feedback = fb * PTS.feedback;
  if (t.rubric && t.rubric.at) b.check = PTS.check;
  if (t.bonus) b.bonus = t.bonus;
  return {total: Math.max(0, Object.values(b).reduce((a, v) => a + v, 0)), b};
}

  (function f(t){ c.clearRect(0,0,W,H); P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; c.save(); c.translate(p.x,p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c.restore(); });

/* ---------------- App ---------------- */
const App = { view:"landing", teamId:null, unlocked:false, draft:{}, sims:{}, film:null, seenFinish:null, seenVerify:null, seenJudge:null, dockHidden:false, local:{} };

function parseHash(){
  const h = (location.hash || "").replace("#","");
  if (h === "control") return {view:"control"};
  if (h === "screen") return {view:"screen"};
  const m = h.match(/^team-([1-4])$/); if (m) return {view:"team", teamId:"t"+m[1]};
  const saved = lsGet("echoArena.team"); if (saved && TEAM_IDS.includes(saved)) return {view:"team", teamId:saved};
  return {view:"landing"};
}

let renderQueued = false;
function render(){ if (renderQueued) return; renderQueued = true; const go = () => { if (!renderQueued) return; renderQueued = false; doRender(); }; requestAnimationFrame(go); setTimeout(go, 120); }
function region(el, key, fn){ if (!el) return; if (el.dataset.key !== key){ el.dataset.key = key; el.innerHTML = fn(); } }

function doRender(){
  const app = $("#app");
  if (App.view === "landing") return renderLanding(app);
  if (App.view === "team") return renderTeam(app);
  if (App.view === "control" && !App.unlocked) return renderPin(app);
  return renderScreen(app);
}

  region(app, "landing|" + JSON.stringify(cfg().teams), () => `
  <div class="wrap"><div class="land">

function laneSteps(id, stage){
  const stt = stageStatus(id, stage), t = team(id), sd = (t.stages||{})[stage] || {};
  const order = ["coding","solved","judge","verified"], k = order.indexOf(stt);
  const tested = sd.check && Object.values(sd.check).filter(Boolean).length >= 3;
  const on = [k >= 1, k >= 1 && (tested || k >= 2), k >= 2, k >= 3];
  return `<div class="steps">${on.map((v,i) => `<span class="${v ? "on" : ""} ${i === 2 && stt === "judge" ? "pend" : ""}"></span>`).join("")}</div>`;
}

function judgeQueue(ctrl){
  return TEAM_IDS.filter(id => team(id).judge && team(id).judge.stage).sort((a,b) => team(a).judge.at - team(b).judge.at).map(id => { const j = team(id).judge, c = tcfg(id);

      ${j.log ? `<div class="log">“${esc(j.log)}”</div>` : ""}
      ${ctrl ? `<div class="checkrow"><button class="btn good sm" data-act="verify" data-team="${id}" data-stage="${j.stage}">✓ Verified</button><button class="btn bad sm" data-act="return" data-team="${id}" data-stage="${j.stage}">Not yet</button></div>` : `<div class="muted" style="font-size:.85em">Judge on the way…</div>`}</div>`; }).join("");
}
function feedHTML(){
  const ev = [];
  TEAM_IDS.forEach(id => { const t = team(id), n = esc(tcfg(id).name), col = tcfg(id).color;
    Object.entries(t.stages || {}).forEach(([x, sd]) => { if (sd.solvedAt) ev.push([sd.solvedAt, col, `<b>${n}</b> cracked the ${x} code`]); });
    Object.entries(t.verified || {}).forEach(([x, v]) => { if (v && v.at) ev.push([v.at, col, `<b>${n}</b> cleared <b style="color:var(--${x})">${x.toUpperCase()}</b> in ${fmt(v.ms)}`]); });
    if (t.judge && t.judge.stage) ev.push([t.judge.at, col, `<b>${n}</b> called the judge`]);
    if (t.returned && t.returned.stage) ev.push([t.returned.at, col, `<b>${n}</b>: back to testing (${esc(t.returned.reason)})`]);
  });
  ev.sort((a,b) => b[0] - a[0]);
  return ev.slice(0, 12).map(([ts, col, h]) => `<div class="ev"><span class="dot" style="background:${col}"></span><span style="flex:1">${h}</span><time>${clock(ts)}</time></div>`).join("") || `<div class="muted" style="font-size:.9em">Events appear here as teams crack codes and clear stages.</div>`;
}

function tLab(body, id, s){
  const stage = currentStage(id);
  if (!stage){ const r = race().find(x => x.id === id); region(body, "tdone|" + (r.medal||""), () => `<div class="wait">${r.medal ? medalSVG(r.medal, 200) : ""}<h2>Mission complete!</h2><p class="muted">Finished in ${fmt(r.ms)}. Prepare your presentation: how did you program the robot, and what was hard?</p></div>`); return; }
  const c = tcfg(id), t = team(id), sd = (t.stages||{})[stage] || {}, pz = PUZZLES[c.challenge][stage];
  const stt = stageStatus(id, stage), dk = id + stage;
  if (!App.draft[dk]) App.draft[dk] = {...(sd.answers || {})};
  const answers = App.draft[dk];
  const total = Object.keys(pz.slots).length, filled = Object.keys(answers).length;
  const step = stt === "coding" ? 0 : stt === "solved" ? ((App.local["sim"+dk] || sd.check || sd.log || (t.returned && t.returned.stage === stage)) ? 2 : 1) : 3;
  if (App.draft["log"+dk] == null) App.draft["log"+dk] = sd.log || "";
  const locked = !labStarted() || timeUp();
  const key = "tlab|" + stage + "|" + stt + "|" + step + "|" + JSON.stringify(sd.hints||[]) + "|" + (sd.attempts||0) + "|" + JSON.stringify(t.returned) + "|" + locked + "|" + (App.local["lastCheck"+dk]||"") + "|" + JSON.stringify(sd.check||{});
  region(body, key, () => `
    <div class="stepper">${["Crack the code","Run the simulator","Build & test the robot","Call the judge"].map((n,i) => `<div class="s ${i<step?"done":""} ${i===step?"cur":""}"><small>${i<step?"Done":"Step "+(i+1)}</small><b>${n}</b></div>`).join("")}</div>
    ${!labStarted() ? `<div class="banner">The lab clock hasn't started. Read the code together while you wait.</div>` : timeUp() ? `<div class="banner" style="border-color:var(--bad);color:var(--bad)">Time is up! Hands off the robot.</div>` : ""}
    <div class="labcols">
      <div style="display:grid;gap:14px;min-width:0">
        <div class="panel box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><span class="tier ${stage}">${stage}</span> <b style="font-size:18px">${esc(CH[c.challenge].stages[stage].title)}</b></div><span class="muted" id="fillcount">${stt === "coding" ? `${filled}/${total} blanks filled` : "Code cracked ✓"}</span></div>
          <div class="prog" id="prog">${rNodes(pz.prog, {slots:pz.slots, answers, hints:sd.hints, solved: stt !== "coding", locked})}</div>
          ${stt === "coding" ? `<div class="checkrow"><button class="btn pri" data-act="check" ${locked?"disabled":""}>Check our code</button><button class="btn" data-act="hint" ${!(sd.attempts>0) || locked ? "disabled" : ""}>Get a hint (${PTS.hint} pts)</button><span class="muted" style="font-size:13px">Attempts: ${sd.attempts||0}</span></div>
            <div id="checkmsg">${App.local["lastCheck"+dk] || ""}</div>
            ${(sd.hints||[]).map(h => `<div class="msg warn"><b>Hint:</b> ${esc(pz.slots[h].hint)}</div>`).join("")}` : ""}
        </div>
        ${step >= 1 ? `<div class="panel box sim"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Simulator · your program on a virtual mBot2</h3><div class="simbar"><button class="btn sm pri" data-act="simrun">▶ Run</button><button class="btn sm" data-act="simreset">↺</button><button class="btn sm ghost" data-act="simspeed">×2</button></div></div>
          <canvas id="simcv"></canvas><div class="simlog" id="simlog"></div>
          ${step === 1 ? `<button class="btn good" data-act="simdone">Our robot logic works → build it for real</button>` : ""}</div>` : ""}
      </div>
      <div style="display:grid;gap:14px;min-width:0">
        ${step >= 2 ? `<div class="panel box"><h3>Build & test on the real mBot2</h3>
          <div class="ticks">${["Built the script in mBlock 5 and uploaded it","Tested the robot on the real course","Changed at least one number to tune it"].map((k,i) => { const on = (sd.check||{})["c"+i]; return `<button class="tick ${on?"on":""}" data-act="ctick" data-i="${i}" ${stt==="judge"?"disabled":""}><span class="bx">${on?"✓":""}</span><span>${k}</span></button>`; }).join("")}</div>
          <label class="fld">Engineering log: one number we changed, and why<textarea id="englog-${stage}" maxlength="240" placeholder="e.g. We changed 20 to 25 because the robot stopped too close to the wall." ${stt==="judge"?"disabled":""}>${esc(App.draft["log"+dk])}</textarea></label>
          ${t.returned && t.returned.stage === stage ? `<div class="msg bad">Judge: not yet. ${esc(t.returned.reason)}. Fix it and call again.</div>` : ""}
          ${stt === "judge" ? `<div class="msg warn">The judge is coming. Get the robot to the start line!</div>` : `<button class="btn warn lg" data-act="calljudge" ${locked?"disabled":""}>Call the judge</button>`}
        </div>` : `<div class="panel box"><h3>How to crack it</h3><ol style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>Read the whole program aloud together.</li><li>Tap a <b>?</b> blank and agree on the missing piece.</li><li>Check your code. You'll see how many blanks are right.</li><li>Stuck? A hint shows one wrong blank and a clue.</li></ol></div>`}
        <div class="panel box"><h3>Engineer's toolkit</h3>${CH[c.challenge].tune.map(([a,b]) => `<div style="font-size:13px"><b>${esc(a)}</b><div class="muted">${esc(b)}</div></div>`).join("")}</div>
        <div class="panel box"><h3>The race</h3><div class="minirace" id="minirace"></div></div>
      </div>
    </div>`);
  // mini race (cheap, always refresh)
  const mr = $("#minirace"); if (mr) mr.innerHTML = TEAM_IDS.map(x => { const tc = tcfg(x), stg = stagesOf(x); const prog = stg.reduce((a, y) => a + ({coding:0, solved:.4, judge:.75, verified:1}[stageStatus(x,y)]), 0) / stg.length; const rr = race().find(q => q.id === x);
    return `<div class="r" style="--tc:${tc.color}">${emb(x, false, 24)}<div class="bar2"><i style="width:${prog*100}%"></i></div><span>${rr.medal && rr.finished ? medalSVG(rr.medal, 22) : Math.round(prog*100) + "%"}</span></div>`; }).join("");
  // simulator
  const cv = $("#simcv");
  if (cv && (!App.sims.cur || App.sims.cur.cv !== cv)){
    if (App.sims.cur) App.sims.cur.stop();
    App.sims.cur = c.challenge === "maze" ? new MazeSim(cv, stage, $("#simlog")) : new SumoSim(cv, stage, $("#simlog"));
    if (step === 1 && !App.local["autorun"+dk]){ App.local["autorun"+dk] = 1; setTimeout(() => App.sims.cur && App.sims.cur.run(), 500); }
  }
}

/* ---------------- Events, ceremonies ---------------- */
function watchEvents(s){
  const fin = race().filter(r => r.finished).map(r => r.id);
  const ver = []; TEAM_IDS.forEach(id => Object.keys(team(id).verified || {}).forEach(x => ver.push(id + x)));
  const jd = TEAM_IDS.filter(id => team(id).judge && team(id).judge.stage).map(id => id + team(id).judge.stage + team(id).judge.at);
  if (App.seenFinish === null || Date.now() - (App.bootAt||0) < 2500){ App.seenFinish = fin; App.seenVerify = ver; App.seenJudge = jd; return; }
  fin.filter(id => !App.seenFinish.includes(id)).forEach(id => ceremony(id));
  ver.filter(v => !App.seenVerify.includes(v) && !fin.includes(v.slice(0,2))).forEach(v => { const id = v.slice(0,2); toast(`${emb(id)}<span><b>${esc(tcfg(id).name)}</b> cleared <b style="color:var(--${v.slice(2)})">${v.slice(2).toUpperCase()}</b>!</span>`, tcfg(id).color); Snd.good(); });
  jd.filter(j => !App.seenJudge.includes(j)).forEach(j => { const id = j.slice(0,2); toast(`${emb(id)}<span><b>${esc(tcfg(id).name)}</b> called the judge</span>`, "var(--signal)"); Snd.judge(); });
  App.seenFinish = fin; App.seenVerify = ver; App.seenJudge = jd;
}
function watchTeamEvents(id){
  const r = race().find(x => x.id === id), fin = r.finished ? [id] : [];
  const t = team(id), ver = Object.keys(t.verified || {}), ret = t.returned && t.returned.stage ? [String(t.returned.at)] : [];
  if (App.seenFinish === null || Date.now() - (App.bootAt||0) < 2500){ App.seenFinish = fin; App.seenVerify = ver; App.seenJudge = ret; return; }
  if (fin.length && !App.seenFinish.length) ceremony(id);
  else ver.filter(v => !App.seenVerify.includes(v)).forEach(v => { toast(`<b>${v.toUpperCase()} cleared!</b>&nbsp;Next stage unlocked.`, "var(--ok)"); Snd.good(); confetti(1500); });
  ret.filter(x => !App.seenJudge.includes(x)).forEach(() => { toast(`Judge: not yet. ${esc(t.returned.reason)}`, "var(--bad)"); Snd.bad(); });
  App.seenFinish = fin; App.seenVerify = ver; App.seenJudge = ret;
}
function ceremony(id){
  const r = race().find(x => x.id === id), c = tcfg(id); if (!r || !r.medal) return;
  const title = {gold:"GOLD", silver:"SILVER", bronze:"BRONZE", finisher:"FINISHER"}[r.medal];
  overlay(`<div class="cere" style="--tc:${c.color}">${medalSVG(r.medal, 260)}<div class="eyebrow">Mission complete · place ${r.place}</div><h2 style="color:var(--${r.medal === "finisher" ? "sonar" : r.medal})">${title}</h2><div class="disp" style="font-size:clamp(28px,4vw,48px);color:${c.color}">${esc(c.name)}</div><div class="mono tnum" style="font-size:22px">${fmt(r.ms)}</div><button class="btn ghost" onclick="closeOverlay()">Continue</button></div>`);
  Snd.fanfare(); confetti(4200); setTimeout(() => { const o = $("#ov"); if (o && o.querySelector(".cere")) closeOverlay(); }, 9000);
}

function setState(patch){ return Store.update("arena/state", patch); }
function newSession(){
  const sid = "s" + Date.now().toString(36);

  Store.set("arena/state", {session:sid, phase:"lobby", timer:{running:false, acc:0, startedAt:0, dur:c.labMin*60000}, quiz:{i:0, open:false, reveal:false}, spotlight:"t1", revealWarm:false, podiumShown:false, createdAt:Date.now()});
  TEAM_IDS.forEach(id => Store.set("teams/" + id, {session:sid}));
  Object.keys(Store.all()).filter(k => k.startsWith("feedback/")).forEach(k => Store.del(k));

function bootControl(){
  if (!st()){ const c = lsGet("echoArena.cache"); if (Store.mode === "server" && c && c["arena/state"]) Object.keys(c).forEach(k => Store.set(k, c[k])); else newSession(); }
  if (!Store.get("arena/config")) Store.set("arena/config", clone(DEFAULT_CONFIG));
  Store.presence({kind:"control"});
}
function goPhase(dir){
  const s = st(), i = Math.max(0, Math.min(PHASES.length-1, phaseIdx(s.phase) + dir)), ph = PHASES[i].id;
  const patch = {phase: ph};
  if (ph === "lab" && !labStarted()) patch.timer = {running:true, startedAt:Date.now(), acc:0, dur:(s.timer && s.timer.dur) || cfg().labMin*60000};
  if (s.phase === "lab" && ph !== "lab" && s.timer && s.timer.running) patch.timer = {running:false, acc: elapsedMs(s.timer), startedAt:0};
  if (ph !== "intro" && App.film){ App.film.pause(); App.film.stopVoice(); }
  setState(patch); Snd.click();
}

    case "prev": goPhase(-1); break;
    case "tstart": setState({timer:{running:true, startedAt:Date.now(), acc:(s.timer||{}).acc||0, dur:(s.timer||{}).dur || cfg().labMin*60000}}); break;

    case "treset2": setState({timer:{running:false, acc:0, startedAt:0, dur:cfg().labMin*60000}}); closeOverlay(); break;
    case "revealWarm": setState({revealWarm: !s.revealWarm}); break;

    case "sound": Snd.on = !Snd.on; if (!Snd.on) try { speechSynthesis.cancel(); } catch(e){} render(); { const fs = $("#filmsnd"); if (fs) fs.textContent = Snd.on ? "Sound on" : "Sound off"; } break;
    case "introtab": App.introTab = b.dataset.v; if (App.film){ App.film.pause(); App.film.stopVoice(); } App.film = null; render(); break;

    case "reset2": newSession(); closeOverlay(); toast("New class started. Teams can join."); break;
    case "bonus": { const id = b.dataset.team; Store.update("teams/" + id, {bonus: (team(id).bonus || 0) + (+b.dataset.n)}); setTimeout(openTeamsPanel, 50); break; }
    case "mverify": { const id = b.dataset.team, x = b.dataset.stage; Store.update("teams/" + id, {verified:{[x]:{at:Date.now(), ms:elapsedMs(s.timer)}}, judge:{stage:null}, stages:{[x]:{solvedAt:(team(id).stages||{})[x]?.solvedAt || Date.now()}}}); setTimeout(openTeamsPanel, 50); break; }
    case "munverify": { const id = b.dataset.team, x = b.dataset.stage; const v = clone(team(id).verified || {}); delete v[x]; const full = clone(team(id)); full.verified = v; Store.set("teams/" + id, full); App.seenFinish = null; setTimeout(openTeamsPanel, 50); break; }
    /* team actions */
    case "warm": Store.update(tp, {warm:{c:+b.dataset.i, at:Date.now()}}); Snd.click(); break;
    case "slot": { const id = T, stage = currentStage(id), pz = PUZZLES[tcfg(id).challenge][stage], dk = id + stage;
      slotPopover(b, pz.slots[b.dataset.slot], i => { App.draft[dk][b.dataset.slot] = i; Snd.click(); const p = $("#prog"); if (p){ const sd = (team(id).stages||{})[stage] || {}; p.innerHTML = rNodes(pz.prog, {slots:pz.slots, answers:App.draft[dk], hints:sd.hints, solved:false}); } const fc = $("#fillcount"); if (fc) fc.textContent = `${Object.keys(App.draft[dk]).length}/${Object.keys(pz.slots).length} blanks filled`; }); break; }
    case "check": { const id = T, stage = currentStage(id), pz = PUZZLES[tcfg(id).challenge][stage], dk = id + stage, ans = App.draft[dk] || {};
      const keys = Object.keys(pz.slots), right = keys.filter(k => ans[k] === pz.slots[k].ans).length, sd = (team(id).stages||{})[stage] || {};
      if (Object.keys(ans).length < keys.length){ App.local["lastCheck"+dk] = `<div class="msg warn">Fill every blank first (${Object.keys(ans).length}/${keys.length}).</div>`; render(); break; }

      else { Store.update(tp, {stages:{[stage]:{answers:ans, attempts:(sd.attempts||0)+1}}}); Snd.bad(); App.local["lastCheck"+dk] = `<div class="msg bad"><b>${right} of ${keys.length}</b> blanks are right. Talk it through: which ${keys.length-right} could be wrong? Read the program aloud.</div>`; }
      break; }
    case "hint": { const id = T, stage = currentStage(id), pz = PUZZLES[tcfg(id).challenge][stage], dk = id + stage, ans = App.draft[dk] || {}, sd = (team(id).stages||{})[stage] || {};
      const hints = sd.hints || []; const k = Object.keys(pz.slots).find(k => ans[k] !== pz.slots[k].ans && !hints.includes(k)) || Object.keys(pz.slots).find(k => !hints.includes(k) && ans[k] !== pz.slots[k].ans);
      if (!k){ toast("Your blanks are all right already. Press Check!"); break; }
      Store.update(tp, {stages:{[stage]:{hints:[...hints, k]}}}); break; }
    case "simrun": App.sims.cur && App.sims.cur.run(); break;
    case "simreset": App.sims.cur && App.sims.cur.reset(); break;
    case "simspeed": if (App.sims.cur){ App.sims.cur.speed = App.sims.cur.speed === 1 ? 2 : 1; b.textContent = App.sims.cur.speed === 1 ? "×2" : "×1"; } break;
    case "simdone": App.local["sim" + T + currentStage(T)] = 1; render(); break;
    case "ctick": { const stage = currentStage(T), sd = (team(T).stages||{})[stage] || {}; const k = "c" + b.dataset.i; Store.update(tp, {stages:{[stage]:{check:{[k]: !((sd.check||{})[k])}}}}); Snd.click(); break; }
    case "calljudge": { const stage = currentStage(T), sd = (team(T).stages||{})[stage] || {}, log = ($("#englog-" + stage) || {}).value || "";
      const ticks = Object.values(sd.check || {}).filter(Boolean).length;

      Store.update(tp, {judge:{stage, at:Date.now(), log:log.trim()}, stages:{[stage]:{log:log.trim()}}, returned:{stage:null}}); Snd.judge(); break; }
    case "lev": { const d = App.draft["rub" + T]; d.levels[b.dataset.c] = +b.dataset.l; Snd.click(); render(); break; }
    case "ican": { const d = App.draft["rub" + T]; d.ican[b.dataset.i] = b.dataset.v; render(); break; }

    case "star": { const sp = st().spotlight || "t1", d = App.draft["fb" + sp]; d.stars[b.dataset.k] = +b.dataset.n; render(); break; }

document.addEventListener("keydown", e => {

async function makeReport(){
  const s = st(), rc = race();
  const rows = TEAM_IDS.map(id => { const c = tcfg(id), t = team(id), p = points(id), r = rc.find(x => x.id === id), fbs = feedbacks().filter(f => f.to === id);
    const avg = fbs.length ? (fbs.reduce((a,f) => a + ((f.stars.explain||0)+(f.stars.challenge||0)+(f.stars.team||0))/3, 0)/fbs.length).toFixed(1) : "–";
    const qc = QUIZ.filter((q,i) => ((t.quiz||{})[i]||{}).c === q.a).length;
    return `<tr><td>${esc(c.name)}</td><td>${esc(CH[c.challenge].name)}</td><td>${stagesOf(id).map(x => `${x}: ${t.verified&&t.verified[x] ? fmt(t.verified[x].ms) : "—"}`).join("<br>")}</td><td>${r.medal||"—"}</td><td>${Object.values(t.stages||{}).reduce((n,sd)=>n+(sd.hints||[]).length,0)}</td><td>${t.rubric ? t.rubric.score + " (" + t.rubric.band + ")" : "—"}</td><td>${qc}/${QUIZ.length}</td><td>${avg} (${fbs.length})</td><td>${p.total}</td></tr>`; }).join("");
  const logs = TEAM_IDS.map(id => { const t = team(id), c = tcfg(id); return `<h3>${esc(c.name)}</h3><p><b>Roles:</b> ${ROLES.map(r => `${r.name}: ${esc((t.roles||{})[r.id]||"—")}`).join(" · ")}</p>${stagesOf(id).map(x => `<p><b>${x} log:</b> ${esc(((t.stages||{})[x]||{}).log||"—")}</p>`).join("")}<p><b>Exit ticket:</b> ${CH[c.challenge].exit.map((q,i) => `${esc(q)} → ${esc((t.exit||{})["a"+i]||"—")}`).join("<br>")}</p>${feedbacks().filter(f => f.to === id).map(f => `<p>Feedback from ${esc(tcfg(f.from).name)}: glow “${esc(f.glow)}”, grow “${esc(f.grow)}” ${f.note ? "· " + esc(f.note) : ""}</p>`).join("")}`; }).join("");
  const html = `<!doctype html><meta charset="utf-8"><title>Echo Arena report</title><style>body{font:14px/1.5 Segoe UI,Arial;margin:32px;color:#111}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eef3fb}h1{margin:0}</style>
    <h1>Echo Arena · lesson report</h1><p>${esc(cfg().className)} · mBot2 Maze Solver (Project 10) & Sumo Push (Project 14) · ${new Date().toLocaleString()}</p>
    <table><tr><th>Team</th><th>Challenge</th><th>Stage times</th><th>Medal</th><th>Hints</th><th>Self-assessment /10</th><th>Brain check</th><th>Peer rating (n)</th><th>Points</th></tr>${rows}</table>${logs}`;
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], {type:"text/html"})); a.download = "Echo-Arena-report-" + new Date().toISOString().slice(0,10) + ".html"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Report downloaded"); return; } catch(e){}
  overlay(`<div class="panel card" style="max-width:900px"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Lesson report</h3><button class="btn sm ghost" onclick="closeOverlay()">Close</button></div><div style="background:#fff;color:#111;border-radius:10px;padding:12px;overflow:auto;max-height:60vh">${html.replace(/<!doctype html>|<meta[^>]*>|<title>.*?<\/title>|<style>.*?<\/style>/gs,"")}</div></div>`);
}

/* ---------------- Ticker (timer display only) ---------------- */
let lastSec = null;
setInterval(() => {
  const s = st(); if (!s) return;
  const rem = remainingMs(), started = labStarted();
  document.querySelectorAll("[data-timer]").forEach(el => { el.textContent = fmt(rem); el.classList.toggle("low", started && rem < 120000 && rem > 0); el.classList.toggle("out", started && rem <= 0); });
  const sec = Math.ceil(rem/1000);
  if (App.view === "control" && s.timer && s.timer.running && sec !== lastSec && sec <= 10 && sec > 0) Snd.tick();
  if (lastSec !== null && lastSec > 0 && sec <= 0 && s.timer && s.timer.running && App.view !== "team"){ Snd.fanfare(); toast("<b>TIME!</b>&nbsp;Hands off the robots.", "var(--bad)"); }
  if (App.view === "team" && s.phase === "lab" && ((lastSec > 0 && sec <= 0) || (lastSec === null))) { const b = $("#tbody"); if (b && lastSec !== null) { b.dataset.key = ""; render(); } }
  lastSec = sec;
}, 250);

/* ---------------- Boot ---------------- */
window.addEventListener("hashchange", () => { Object.assign(App, parseHash()); App.seenFinish = null; if (App.view === "control" && App.unlocked) bootControl(); $("#app").dataset.key = ""; render(); });
Store.on(() => {
  if (App.view === "team" && st()){
    const s = st(); if (App._session && App._session !== s.session){ App.draft = {}; App.local = {}; App.seenFinish = null; } App._session = s.session;
  }
  render();
});
(async function boot(){
  Object.assign(App, parseHash());
  try { App.unlocked = sessionStorage.getItem("echoArena.unlocked") === "1"; } catch(e){}
  render();
  await Store.init();
  App.bootAt = Date.now();
  if (!st() && Store.mode === "server" && App.view !== "control") setTimeout(render, 50);
  if (App.view === "control" && App.unlocked) bootControl();
  render();
})();
</script>
</body>
</html>
